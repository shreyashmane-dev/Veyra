run_name: pretrain-veyra-125m
model_config_path: configs/models/veyra_125m.yaml
dataset_dir: data/shards
output_dir: checkpoints/veyra_125m
device: auto
precision: bfloat16
batch_size: 16
gradient_accumulation_steps: 8
max_steps: 50000
eval_interval: 500
save_interval: 1000
log_interval: 10
learning_rate: 0.0006
min_learning_rate: 0.00006
warmup_steps: 2000
weight_decay: 0.1
clip_grad_norm: 1.0
adam_beta1: 0.9
adam_beta2: 0.95
adam_eps: 0.00000001
seed: 42
detect_nan: true
max_grad_norm_warn: 5.0
compile_model: false
