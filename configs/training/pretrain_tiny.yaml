run_name: pretrain-veyra-tiny
model_config_path: configs/models/veyra_tiny.yaml
dataset_dir: data/shards
output_dir: checkpoints/veyra_tiny
device: auto
precision: float32
batch_size: 2
gradient_accumulation_steps: 2
max_steps: 60
eval_interval: 10
save_interval: 20
log_interval: 5
learning_rate: 0.0005
min_learning_rate: 0.00005
warmup_steps: 20
weight_decay: 0.01
clip_grad_norm: 1.0
adam_beta1: 0.9
adam_beta2: 0.95
adam_eps: 0.00000001
seed: 42
detect_nan: true
max_grad_norm_warn: 5.0
compile_model: false
