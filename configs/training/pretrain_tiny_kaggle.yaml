run_name: pretrain-veyra-tiny-kaggle
model_config_path: configs/models/veyra_tiny.yaml
dataset_dir: data/shards
output_dir: /kaggle/working/checkpoints/veyra_tiny
device: cuda
precision: float16
batch_size: 16
gradient_accumulation_steps: 2
max_steps: 200
eval_interval: 25
save_interval: 50
log_interval: 5
learning_rate: 0.001
min_learning_rate: 0.0001
warmup_steps: 20
weight_decay: 0.01
clip_grad_norm: 1.0
adam_beta1: 0.9
adam_beta2: 0.95
adam_eps: 0.00000001
seed: 42
detect_nan: true
max_grad_norm_warn: 5.0
compile_model: false
