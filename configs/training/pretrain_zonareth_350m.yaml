run_name: pretrain-zonareth-350m
model_config_path: configs/models/zonareth_350m.yaml
dataset_dir: data/shards
output_dir: checkpoints/zonareth_350m
device: cuda
precision: float16
batch_size: 4
gradient_accumulation_steps: 32
max_steps: 5000
eval_interval: 200
save_interval: 250
log_interval: 10
learning_rate: 0.0004
min_learning_rate: 0.00004
warmup_steps: 500
weight_decay: 0.1
clip_grad_norm: 1.0
adam_beta1: 0.9
adam_beta2: 0.95
adam_eps: 0.00000001
seed: 42
detect_nan: true
max_grad_norm_warn: 5.0
compile_model: false
